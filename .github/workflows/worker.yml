name: Scheduled Task Runner

on:
  schedule:
  
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Runner
        env:
          SOURCE_ENDPOINT: ${{ secrets.SOURCE_ENDPOINT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          WEBHOOK_ENDPOINT: ${{ secrets.WEBHOOK_ENDPOINT }}
        run: node index.js
