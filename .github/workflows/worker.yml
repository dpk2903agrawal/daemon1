name: Scheduled Task Runner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Runner
        env:
          RUNNER_ENDPOINT: ${{ secrets.RUNNER_ENDPOINT }}
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
        run: node index.js
