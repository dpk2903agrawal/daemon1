name: Cloud Watchdog Daemon

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  scheduled-job:
    name: Execute Scheduled Watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install cheerio

      - name: Run Cloud Monitor Runner
        run: node index.js
        env:
          SITE_URL: ${{ secrets.SITE_URL || secrets.SOURCE_ENDPOINT || vars.SITE_URL || vars.SOURCE_ENDPOINT }}
          SOURCE_ENDPOINT: ${{ secrets.SITE_URL || secrets.SOURCE_ENDPOINT || vars.SITE_URL || vars.SOURCE_ENDPOINT }}
          WEBHOOK_SECRET: ${{ secrets.SECRET_KEY || secrets.WEBHOOK_SECRET || vars.SECRET_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || secrets.WEBHOOK_SECRET || vars.SECRET_KEY }}
          WEBHOOK_ENDPOINT: ${{ secrets.WEBHOOK_ENDPOINT || vars.WEBHOOK_ENDPOINT }}
