async function getTargets() {
  if (!SITE_URL) {
    console.error('[Watchdog] Error: SITE_URL is not set in environment.');
    return [];
  }
  try {
    const res = await fetch(`${SITE_URL}/api/ai-scraper/portals?token=${SECRET}`, {
      headers: {
        'User-Agent': 'Mozilla/5.0',
        'Authorization': `Bearer ${SECRET}`,
        'x-webhook-secret': SECRET,
      },
    });
    if (!res.ok) {
      console.error(`[Watchdog] Error fetching from host: HTTP ${res.status}`);
      return [];
    }
    const data = await res.json();
    const active = (data.portals || []).filter((p) => p.isEnabled);
    console.log(`[Watchdog] Loaded ${active.length} active target(s) from host.`);
    return active.map((t) => ({
      name: t.name,
      url: t.url,
      selector: 'a',
      keywords: (t.keywords || 'recruitment,notice,admit,result,vacancy')
        .split(',')
        .map((k) => k.trim().toLowerCase())
        .filter(Boolean),
    }));
  } catch (err) {
    console.error('[Watchdog] Error connecting to host:', err.message);
  }
  return [];
}
